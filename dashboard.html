<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamShield | Security Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050b1a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .stat-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dashboard-content {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .table-header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .link-list {
            padding: 0;
            list-style: none;
        }

        .link-item {
            padding: 20px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 24px;
            transition: background 0.3s;
        }

        .link-item:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .link-info {
            min-width: 0;
        }

        .link-url {
            font-weight: 500;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 4px;
            display: block;
        }

        .link-meta {
            font-size: 0.8125rem;
            color: var(--text-dim);
            display: flex;
            gap: 12px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-blocked {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: pulse 2s infinite;
        }

        .badge-safe {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .report-count {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            min-width: 60px;
            text-align: center;
        }

        .btn-report {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-report:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn-report:active {
            transform: scale(0.95);
        }

        .btn-report.disabled {
            background: var(--glass-border);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Empty State */
        .empty-state {
            padding: 60px;
            text-align: center;
            color: var(--text-dim);
        }

        @media (max-width: 640px) {
            .link-item {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .link-meta {
                flex-direction: column;
                gap: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                </div>
                <h1>ScamShield Dashboard</h1>
            </div>
            <div id="status-badge" class="badge badge-safe">Backend Online</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">0</div>
                <div class="stat-label">Links Scanned</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-reports" style="color: var(--danger)">0</div>
                <div class="stat-label">Total Reports</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-blocked" style="color: #fbbf24">0</div>
                <div class="stat-label">Community Blocked</div>
            </div>
        </div>

        <div class="dashboard-content">
            <div class="table-header">
                <h2>Recent Scanning Activity</h2>
                <div style="font-size: 0.8rem; color: var(--text-dim)">Live Monitoring Active</div>
            </div>
            <ul id="link-list" class="link-list">
                <!-- Links will be injected here -->
                <div class="empty-state">
                    Loading security logs...
                </div>
            </ul>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin; // Same origin if served by Express

        async function fetchLinks() {
            try {
                const res = await fetch(`${API_BASE}/api/links`);
                const links = await res.json();
                renderLinks(links);
                updateStats(links);
            } catch (err) {
                console.error('Failed to fetch links:', err);
                document.getElementById('link-list').innerHTML = `<div class="empty-state">Unable to connect to security database.</div>`;
            }
        }

        function renderLinks(links) {
            const list = document.getElementById('link-list');
            if (links.length === 0) {
                list.innerHTML = `<div class="empty-state">No links scanned yet. Start browsing to see results.</div>`;
                return;
            }

            list.innerHTML = links.map(link => {
                const isBlocked = link.reportCount > 5;
                return `
                    <li class="link-item">
                        <div class="link-info">
                            <span class="link-url" title="${link.url}">${link.url}</span>
                            <div class="link-meta">
                                <span>Source: ${link.source || 'Manual'}</span>
                                ${isBlocked ? '<span class="badge badge-blocked">Blocked by more users</span>' : '<span class="badge badge-safe">Normal Traffic</span>'}
                            </div>
                        </div>
                        <div class="report-count">
                            ${link.reportCount} Reports
                        </div>
                        <button class="btn-report" onclick="reportLink('${link.url}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            Report
                        </button>
                    </li>
                `;
            }).join('');
        }

        function updateStats(links) {
            document.getElementById('stat-total').textContent = links.length;
            const totalReports = links.reduce((sum, link) => sum + link.reportCount, 0);
            document.getElementById('stat-reports').textContent = totalReports;
            const communityBlocked = links.filter(l => l.reportCount > 5).length;
            document.getElementById('stat-blocked').textContent = communityBlocked;
        }

        async function reportLink(url) {
            try {
                const res = await fetch(`${API_BASE}/api/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                if (res.ok) {
                    fetchLinks(); // Refresh list
                }
            } catch (err) {
                console.error('Report failed:', err);
            }
        }

        // Initial fetch and polling
        fetchLinks();
        setInterval(fetchLinks, 5000); // Polling every 5 seconds for live updates
    </script>
</body>
</html>
